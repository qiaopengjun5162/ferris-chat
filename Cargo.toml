[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.profiling]
debug = "full"
inherits = "release"
strip = false

[workspace]
members = ["chat_server", "notify_server"]
resolver = "2"


[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = [
  "http2",
  "query",
  "tracing",
  "multipart", # file sharing
  # "macros",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.33"
sqlx = { version = "0.8.6", features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "runtime-tokio-rustls",
] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
